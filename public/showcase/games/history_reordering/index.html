<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日本史 並べ替え</title>
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="script.js" defer></script>
  </head>
  <body>
    <div id="start" hidden>
      <div id="options">
        <div>
          <label>
            <input type="checkbox" id="challengeModeToggle" class="switch" />
            チャレンジモード
          </label>
        </div>
        <div>
          <label>
            問題数
            <input type="number" id="questionCountInput" min="1" max="20" value="5" />
          </label>
        </div>
        <div>
          <span>範囲: </span>
          <label>
            <input type="number" id="yearRangeStartInput" />
            年
          </label>
          <span>から</span>
          <label>
            <input type="number" id="yearRangeEndInput" />
            年
          </label>
          <span>まで</span>
        </div>
      </div>
      <button id="startButton">開始</button>
    </div>
    <div id="quiz" hidden>
      <p id="progress"></p>
      <p>下記の出来事を左から年号順に並べ</p>
      <div id="container"></div>
      <div id="fakeContainer"></div>
      <button id="submitButton" class="quiz-button">回答する</button>
      <button id="continueButton" class="quiz-button" hidden>次へ</button>
    </div>
    <div id="end" hidden>
      <p id="yearRangeText"><span id="yearRangeStartText"></span>年から<span id="yearRangeEndText"></span>年まで</p>
      <p id="challengeModeText">チャレンジモード</p>
      <p><span id="correctCount"></span> 問正解</p>
      <p>正答率: <span id="correctPercentage"></span></p>
    </div>
  </body>

  <template id="quiz-element">
    <div class="quiz-element">
      <p class="text"></p>
      <p class="year" hidden></p>
    </div>
  </template>
</html>
